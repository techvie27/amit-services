name: CI

on: push

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install packages
        run: composer install --no-progress

      - name: Check PHP syntax
        run: php -l amit-services.php

      - name: Check coding standard
        run: vendor/bin/phpcs --standard=WordPress -n amit-services.php

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin package
        run: |
          mkdir amit-services
          cp amit-services.php amit-services/
          zip -r amit-services.zip amit-services

      - name: Save package
        uses: actions/upload-artifact@v4
        with:
          name: amit-services-plugin
          path: amit-services.zip